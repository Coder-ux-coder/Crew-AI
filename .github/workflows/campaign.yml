name: Campaign cloud checks

on:
  push:
    branches:
      - claude/exciting-heisenberg-6w6gge
      - claude/jolly-wright-lz430a

permissions:
  contents: read

concurrency:
  group: crew-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Isolate test data and browser files
        run: |
          echo "CREW_HOME=$RUNNER_TEMP/crew-campaign-home" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
      - name: Install test tools
        run: |
          python -m pip install ruff -r crew/requirements-app.txt
          npm install --prefix .github/campaign --no-save --package-lock=false eslint@10 globals
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('CREW_CHROMIUM=' + p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
          git config --global user.name "Crew tests"
          git config --global user.email "crew-tests@example.invalid"
      - name: Full test suite with fake agents and Chromium
        working-directory: crew
        run: timeout 12m python -m unittest discover -s tests -v
      - name: Python syntax
        if: ${{ !cancelled() }}
        run: python -W error -m compileall -q crew/crewlib crew/crewapp crew/tests
      - name: Python lint
        if: ${{ !cancelled() }}
        run: ruff check --config .github/campaign/ruff.toml crew/crewlib crew/crewapp
      - name: JavaScript lint
        if: ${{ !cancelled() }}
        run: .github/campaign/node_modules/.bin/eslint --config .github/campaign/eslint.config.mjs crew/crewapp/static
      - name: JavaScript syntax
        if: ${{ !cancelled() }}
        run: find crew/crewapp/static -name '*.js' -print0 | xargs -0 -n 1 node --check
