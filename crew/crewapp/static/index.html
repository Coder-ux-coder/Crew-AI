<link rel="stylesheet" href="/app.css">
<script>
  // Apply the saved look before anything paints (no flash of the wrong theme).
  try {
    var d = document.documentElement, t = localStorage.getItem('crew.theme'), a = localStorage.getItem('crew.accent'),
        f = localStorage.getItem('crew.font'), s = localStorage.getItem('crew.sidebar');
    if (t && t !== 'system') d.dataset.theme = t;
    if (a && a !== 'clay') d.dataset.accent = a;
    if (f === 'sans') d.dataset.font = 'sans';
    if (s === 'closed') d.dataset.sidebar = 'closed';
  } catch (e) {}
</script>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main menu">
    <div class="sb-top">
      <a class="logo" href="#/" title="Crew home"><span class="logo-mark"><svg class="i"><use href="#i-spark"/></svg></span><b>Crew</b></a>
      <button class="icon-btn" id="sbClose" title="Close the sidebar" aria-label="Close the sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
    </div>
    <a class="new-chat" href="#/new" id="newChat"><span class="plus"><svg class="i"><use href="#i-plus"/></svg></span>New chat</a>
    <nav class="sb-nav" id="nav">
      <a href="#/chats" data-nav="chats"><svg class="i"><use href="#i-chat"/></svg>Chats</a>
      <a href="#/projects" data-nav="projects"><svg class="i"><use href="#i-layers"/></svg>Projects<span class="count" id="liveCount"></span></a>
      <a href="#/workflows" data-nav="workflows"><svg class="i"><use href="#i-flow"/></svg>Workflows</a>
      <a href="#/library" data-nav="library"><svg class="i"><use href="#i-folder"/></svg>Library</a>
      <a href="#/skills" data-nav="skills"><svg class="i"><use href="#i-sparkles"/></svg>Skills</a>
      <a href="#/connections" data-nav="connections"><svg class="i"><use href="#i-plug"/></svg>Connections</a>
      <a href="#/usage" data-nav="usage"><svg class="i"><use href="#i-gauge"/></svg>Usage</a>
    </nav>
    <div class="sb-devices">
      <button data-open="browser" title="Open the browser beside your work"><svg class="i"><use href="#i-globe"/></svg><span>Browser</span></button>
      <button data-open="phone" title="Open your phone beside your work"><svg class="i"><use href="#i-phone"/></svg><span>Phone</span></button>
      <button data-open="computer" title="Open your computer's screen beside your work"><svg class="i"><use href="#i-monitor"/></svg><span>Computer</span></button>
    </div>
    <div class="sb-label">Recents</div>
    <div class="recents" id="recents"></div>
    <div class="sb-foot">
      <a class="meters" href="#/usage" id="meters" title="How much of your subscriptions is used"></a>
      <div class="sb-foot-row">
        <a class="me" href="#/settings" data-nav="settings"><span class="avatar-sm" id="meInitial">C</span><span id="meName">Settings</span></a>
        <button class="icon-btn" id="themeBtn" title="Light or dark" aria-label="Switch between light and dark"><svg class="i"><use href="#i-moon"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main" id="main">
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="sbOpen" title="Open the sidebar" aria-label="Open the sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button>
      <div class="top-title" id="topTitle"></div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div class="update-banner hidden" id="updateBanner"></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div class="resizer" id="resizer" title="Drag to resize" aria-hidden="true"></div>
  <aside class="panel" id="panel" aria-label="Side panel">
    <div class="panel-head">
      <div class="panel-tabs" id="panelTabs"></div>
      <span class="grow"></span>
      <button class="icon-btn" id="panelMax" title="Make wider" aria-label="Make the panel wider"><svg class="i"><use href="#i-expand"/></svg></button>
      <button class="icon-btn" id="panelClose" title="Close" aria-label="Close the panel"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="recbar"></div>
<noscript><p style="padding:24px">Crew needs JavaScript switched on.</p></noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
