<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew is not running</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 "Segoe UI", system-ui, sans-serif;
         background: #F4F6F5; color: #15201B; }
  @media (prefers-color-scheme: dark) { body { background: #0D1210; color: #E7EEEA; } p { color: #93A19A !important; } }
  main { max-width: 440px; padding: 28px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 24px; margin: 16px 0 8px; }
  p { color: #5F6C66; margin: 0 0 18px; }
  button { font: inherit; font-weight: 600; padding: 10px 20px; border-radius: 12px; border: 0; background: #0C7A55; color: #fff; cursor: pointer; }
</style></head>
<body><main>
  <img src="/icons/icon.svg" alt="">
  <h1>Crew is not running</h1>
  <p>Start Crew on your computer (double-click the Crew icon on the desktop). If you are on your phone, make sure it is on the same Wi-Fi as the computer.</p>
  <p id="auto" style="font-size:14px">This page reconnects by itself as soon as Crew is back.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>
  // Crew may come back on another of its ports (for example right after an update): look for it and go there.
  (function () {
    var here = Number(location.port || 80);
    function probe(port) {
      if (port === here) {
        return fetch('/api/ping', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('no'); return port; });
      }
      // Another port's answers cannot be read from here, but whether Crew's icon loads from it as a picture can be
      // seen: another program that happens to answer there is not taken for Crew.
      return new Promise(function (resolve, reject) {
        var img = new Image(), t = setTimeout(function () { reject(new Error('no')); }, 3000);
        img.onload = function () { clearTimeout(t); resolve(port); };
        img.onerror = function () { clearTimeout(t); reject(new Error('no')); };
        img.src = location.protocol + '//' + location.hostname + ':' + port + '/icons/icon.svg?probe=' + Date.now();
      });
    }
    function scan() {
      var ports = [here];
      for (var p = 8765; p < 8775; p++) if (p !== here) ports.push(p);
      var i = 0;
      (function next() {
        if (i >= ports.length) { setTimeout(scan, 4000); return; }
        var port = ports[i++];
        probe(port).then(function (p) {
          location.href = (p === here) ? location.href : location.protocol + '//' + location.hostname + ':' + p + '/' + location.hash;
        }, next);
      })();
    }
    setTimeout(scan, 1500);
  })();
</script>
</body></html>
